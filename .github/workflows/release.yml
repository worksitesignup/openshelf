# Pushing a tag like v0.1.0 builds every download and publishes a GitHub Release.
# Running it by hand from the Actions tab builds and tests without publishing.
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  macos:
    name: macOS ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: Intel
            runner: macos-15-intel
            arch: x86_64
            file: OpenShelf-macOS-Intel.dmg
          - name: Apple Silicon
            runner: macos-15
            arch: arm64
            file: OpenShelf-macOS-AppleSilicon.dmg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -r packaging/requirements-release.txt
      - name: Run tests
        run: python -m unittest discover tests
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build the app
        run: |
          python tools/make_icns.py
          pyinstaller --noconfirm packaging/openshelf.spec
      - name: Check the app
        run: |
          app="dist/Open Shelf.app"
          exe="$app/Contents/MacOS/OpenShelf"
          lipo -archs "$exe" | grep -qw "${{ matrix.arch }}"
          find "$app" -name QtWebEngineProcess -type f | grep -q .
          codesign --verify --deep --strict --verbose=2 "$app"
          bash packaging/smoke-test.sh "$exe"
      - name: Make the disk image
        run: |
          mkdir -p dmg
          cp -R "dist/Open Shelf.app" dmg/
          ln -s /Applications dmg/Applications
          for attempt in 1 2 3; do
            hdiutil create -volname "Open Shelf" -srcfolder dmg -ov -format UDZO "${{ matrix.file }}" && exit 0
            sleep 15
          done
          exit 1
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}
          if-no-files-found: error

  linux:
    name: Linux AppImage
    # The oldest supported runner, so the app runs on as many distributions as possible.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libdbus-1-3 libnss3 libnspr4 libasound2 libpulse0 libfontconfig1 libglib2.0-0 \
            libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxkbfile1 libxcb-cursor0
      - name: Install dependencies
        run: pip install -r packaging/requirements-release.txt
      - name: Run tests
        run: python -m unittest discover tests
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build the app
        run: pyinstaller --noconfirm packaging/openshelf.spec
      - name: Make the AppImage
        run: bash packaging/build-appimage.sh OpenShelf-Linux-x86_64.AppImage
      - name: Check the AppImage
        run: bash packaging/smoke-test.sh ./OpenShelf-Linux-x86_64.AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - uses: actions/upload-artifact@v7
        with:
          name: OpenShelf-Linux-x86_64.AppImage
          path: OpenShelf-Linux-x86_64.AppImage
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          sha256sum OpenShelf-* > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Open Shelf $GITHUB_REF_NAME" \
            --notes "Download the file for your computer. The README explains how to open the app the first time: https://github.com/$GITHUB_REPOSITORY#download"
